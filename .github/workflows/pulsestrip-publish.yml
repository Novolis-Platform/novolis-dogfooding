name: PulseStrip publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/raylib/PulseStrip/**'
      - 'apps/raylib/PulseStrip.Core/**'
      - '.github/workflows/pulsestrip-publish.yml'
concurrency:
  group: pulsestrip-publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Auth GitHub Packages
        shell: bash
        run: |
          dotnet nuget update source github --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text || \
          dotnet nuget add source "https://nuget.pkg.github.com/Novolis-Platform/index.json" \
            --name github --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      - name: Publish
        run: >
          dotnet publish apps/raylib/PulseStrip/PulseStrip.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o artifacts/pulsestrip-${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: pulsestrip-${{ matrix.rid }}
          path: artifacts/pulsestrip-${{ matrix.rid }}

  android-deferred:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Android not available yet
        run: |
          echo "PulseStrip Android is deferred until Novolis.Raylib ships Android RIDs and a game host."
          echo "Shared race/ML logic is in apps/raylib/PulseStrip.Core for a future head."
          exit 1
